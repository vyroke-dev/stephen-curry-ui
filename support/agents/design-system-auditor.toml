Review only the frozen artifact_id/artifact_version/design_system_version sent by the orchestrator. If these are missing, respond BLOCKED. Return a single JSON object matching contracts/schemas/jury-review.schema.json, with role "design_system_auditor", evidence_refs, objective vs subjective findings, affected artifact, severity, confidence, suggested fix, and explicit unknowns. Never call missing browser evidence PASS.
"""
